const monthNames=["januar","februar","marec","april","maj","junij","julij","avgust","september","oktober","november","december"];
const days=["nedelja","ponedeljek","torek","sreda","četrtek","petek","sobota"];
const q=document.querySelector("#q"), mnz=document.querySelector("#mnz"), round=document.querySelector("#round"), list=document.querySelector("#list"), summary=document.querySelector("#summary");
[...new Set(matches.map(x=>x.mnz))].sort().forEach(v=>mnz.add(new Option(v,v)));
[...new Set(matches.map(x=>x.krog))].sort().forEach(v=>round.add(new Option(v,v)));
function esc(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function prettyDate(ds){let d=new Date(ds+"T12:00:00"); return `${d.getDate()}. ${monthNames[d.getMonth()]} ${d.getFullYear()}`}
function render(){
 const needle=q.value.trim().toLocaleLowerCase("sl");
 const rows=matches.filter(x=>(!mnz.value||x.mnz===mnz.value)&&(!round.value||x.krog===round.value)&&(!needle||`${x.domacin} ${x.gost}`.toLocaleLowerCase("sl").includes(needle)));
 summary.textContent=`Prikazanih ${rows.length} od ${matches.length} tekem`;
 if(!rows.length){list.innerHTML='<div class="empty">Ni tekem, ki ustrezajo izbranim filtrom.</div>';return}
 const groups={}; rows.forEach(x=>(groups[x.datum]??=[]).push(x));
 list.innerHTML=Object.entries(groups).map(([date,arr])=>{
   const d=new Date(date+"T12:00:00");
   return `<section class="day"><div class="day-title"><h2>${prettyDate(date)}</h2><span>${days[d.getDay()]}</span></div>`+
   arr.map(x=>`<article class="card">
     <div class="time">${x.ura?esc(x.ura):'<span class="tbd">URA TBD</span>'}</div>
     <div><div class="teams">${esc(x.domacin)} <span class="dash">–</span> ${esc(x.gost)}</div><div class="meta">${esc(x.mnz)}</div><button class="report" data-match="${esc(x.domacin)} – ${esc(x.gost)}" data-date="${esc(x.datum)}" data-time="${esc(x.ura)}" data-mnz="${esc(x.mnz)}">✎ Popravek / rezultat</button></div>
     <div class="badges"><span class="badge round">${esc(x.krog)}</span></div>
   </article>`).join("")+`</section>`;
 }).join("");
}
[q,mnz,round].forEach(el=>el.addEventListener("input",render)); render();

const modal=document.querySelector("#reportModal"), closeModal=document.querySelector("#closeModal"), reportForm=document.querySelector("#reportForm"), reportMatch=document.querySelector("#reportMatch");
let activeReport=null;
document.addEventListener("click",e=>{
 const b=e.target.closest(".report"); if(!b)return;
 activeReport={match:b.dataset.match,date:b.dataset.date,time:b.dataset.time,mnz:b.dataset.mnz};
 reportMatch.textContent=`${activeReport.match} · ${activeReport.date}${activeReport.time?" · "+activeReport.time:""} · ${activeReport.mnz}`;
 document.querySelector("#matchHidden").value=activeReport.match;
 document.querySelector("#dateHidden").value=activeReport.date;
 document.querySelector("#timeHidden").value=activeReport.time||"ni določena";
 document.querySelector("#mnzHidden").value=activeReport.mnz;
 modal.classList.add("open"); modal.setAttribute("aria-hidden","false"); document.querySelector("#reportText").focus();
});
function shut(){modal.classList.remove("open");modal.setAttribute("aria-hidden","true");}
closeModal.addEventListener("click",shut); modal.addEventListener("click",e=>{if(e.target===modal)shut()});
